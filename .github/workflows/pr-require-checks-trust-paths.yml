name: pr-require-checks-trust-paths
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false
permissions: {}
jobs:
  pr-require-checks-trust-paths:
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    uses: melodic-software/ci-workflows/.github/workflows/pr-require-checks-trust-paths.yml@2097e798cf050506383e1df8d8c0d8c436d9b44c # v0.67.2
    with:
      runner: ubuntu-24.04
