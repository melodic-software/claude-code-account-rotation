name: ci

# Build, test, and gate on every pull request and on main. The org's ci-gate
# context (ci-status, whose pr-contract composite carries the pull-request
# contract) arrives in the release phase; until then this workflow is the
# whole lane.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore (locked mode)
        run: dotnet restore ClaudeCodeAccountRotation.slnx --locked-mode
      - name: Build
        run: dotnet build ClaudeCodeAccountRotation.slnx -c Release --no-restore
      - name: Test
        run: dotnet test ClaudeCodeAccountRotation.slnx -c Release --no-build
      - name: Whitespace format
        run: dotnet format whitespace ClaudeCodeAccountRotation.slnx --verify-no-changes
      # The WSL side runs this same executable published for linux-x64. The
      # smoke proves the published follower serves the dashboard the leader
      # reads (anchor issue #65, R4) against temp roots only.
      - name: linux-x64 publish serves the follower dashboard
        if: matrix.os == 'ubuntu-24.04'
        run: bash eng/smoke-linux-publish.sh

  gates:
    name: Repository gates
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # shellcheck is preinstalled on the ubuntu-24.04 image.
      - name: shellcheck (zero findings)
        run: shellcheck eng/*.sh
      - name: No machine paths in shipped surfaces
        run: bash eng/check-no-machine-paths.sh
