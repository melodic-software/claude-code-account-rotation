# Markdown in this repository. Contract and schema:
# https://github.com/melodic-software/claude-code-plugins/tree/main/docs/contracts/ecosystem-commands
# CI's only markdown check is the offline link and anchor check of its lychee
# job (.github/workflows/pr-require-checks.yml, step 'Check local links and
# anchors', the melodic-software/ci-workflows lychee-offline composite at
# 944d346, v0.74.0, with its default config, standards' lychee.toml). This is that
# composite's command with its default globs and lychee's own defaults. Commands run from the repository root.
enabled: true
globs: ["*.md"]
project-discovery: []
build-cmd: null
test-cmd: null
check-cmd: "lychee --offline --no-progress '**/*.md'"
fix-cmd: null
code-fix-cmd: null
opt-in: "none: lychee runs on its defaults locally; CI falls back to standards' lychee.toml"
install-hint: "lychee at the version ci-workflows' lychee-offline action pins (the version CI installs): winget install lycheeverse.lychee | brew install lychee"
gates: []
notes: "The lychee-offline composite's run.sh runs lychee --offline --no-progress --config <config> <globs>, globs defaulting to '**/*.md'. CI checks every tracked markdown file, not only the changed ones. Locally lychee's defaults do not exclude .work/ paths. markdownlint is not run: no CI lane runs it, and lefthook.yml extends only the guardrails remote config, not .lefthook/base.yml's markdownlint lane, which also needs a root package.json this repository does not have."
