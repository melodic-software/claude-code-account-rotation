<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>claude-code-account-rotation</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <h1>claude-code-account-rotation</h1>
    <p class="tagline">Account switching and quota dashboard for Claude Code</p>
    <p id="captured" class="muted"></p>
    <button id="refresh-all" type="button">Refresh all</button>
    <p id="refresh-state" class="muted"></p>
  </header>
  <div id="banner" class="banner" hidden></div>
  <ul id="warnings" class="warnings" hidden></ul>
  <details class="roster-add">
    <summary>Add an account</summary>
    <form id="add" class="roster-form">
      <label class="field">
        <span>E-mail</span>
        <input id="add-email" name="email" type="email" required autocomplete="off" placeholder="you@example.com">
      </label>
      <div id="add-fields" class="fields"></div>
      <button type="submit">Add</button>
    </form>
  </details>
  <main id="cards" class="cards" aria-live="polite"></main>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
